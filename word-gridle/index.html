  // Applies the saved theme before anything renders, and marks the page as
  // loading so the loader shows instead of the static content
  (function () {
    var html = document.documentElement;
    html.classList.add('boot-loading');
    try {
      var mode = localStorage.getItem('color-scheme');
      if (mode !== 'light' && mode !== 'dark') {
        mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      html.classList.add(mode);
      if (localStorage.getItem('high-contrast') === 'true') html.classList.add('colorblind');
    } catch (e) {}
  })();
</script>

<!-- Shared boot loader: edit shared/boot-loader/boot-loader.html, then run shared/boot-loader/install.mjs -->
<div class="boot-loader" id="boot-loader" role="status">
  <div class="boot-loader__tiles" aria-hidden="true"></div>
  <span class="boot-loader__label">Loading…</span>
</div>
<script>
  (function () {
    var html = document.documentElement;
    var loader = document.getElementById('boot-loader');
    var held = false;
    var done = false;

    // The tiles spell the game's name: <meta name="boot-loader-word">, or the
    // first word of the page title, e.g. "Dordle Unlimited – …" gives DORDLE.
    // The meta may hold more than one word ("WORD PLANT"): each space leaves
    // a half-tile gap. Up to 10 letters are shown.
    var meta = document.querySelector('meta[name="boot-loader-word"]');
    var name = ((meta && meta.content) || document.title.split(/\s+/)[0] || 'WORDLE')
        .replace(/[^a-z ]/gi, '').replace(/ +/g, ' ').trim().toUpperCase() || 'WORDLE';
    var tiles = loader.querySelector('.boot-loader__tiles');
    var word = '';
    var spaces = 0;
    for (var i = 0; i < name.length && word.length < 10; i++) {
      if (name[i] === ' ') {
        var space = document.createElement('i');
        space.className = 'boot-loader__space';
        tiles.appendChild(space);
        spaces++;
        continue;
      }
      var tile = document.createElement('span');
      tile.textContent = name[i];
      tile.style.setProperty('--boot-loader-index', word.length);
      tiles.appendChild(tile);
      word += name[i];
    }
    tiles.style.setProperty('--boot-loader-count', word.length + spaces / 2);
    loader.querySelector('.boot-loader__label').textContent = 'Loading '
        + name.toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); }) + '…';

    // Show late, then show long. The tiles fade in after TILES_DELAY ms. If
    // the game is ready before that, the loader goes at once and no tiles
    // are seen. Once they have started to show, the loader stays until the
    // whole word has been revealed and held, so it never cuts off mid-flip.
    // Timings mirror the CSS: 2.8s cycle, tiles land at 18% of it, 0.1s apart.
    var TILES_DELAY = 250;
    var started = Date.now();
    var wordRevealed = TILES_DELAY + (word.length - 1) * 100 + 0.18 * 2800 + 300;

    function requestHide() {
      var elapsed = Date.now() - started;
      if (elapsed < TILES_DELAY) {
        hide();
      } else {
        setTimeout(hide, Math.max(0, wordRevealed - elapsed));
      }
    }

    var removeTimer;
    var shownForLeaving = false;

    function hide() {
      if (done) return;
      done = true;
      loader.classList.add('boot-loader--hidden');
      removeTimer = setTimeout(function () {
        html.classList.remove('boot-loading');
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 380);
    }

    // Covers the page again, e.g. right before moving to another page (the
    // next page's own loader takes over). The tiles start afresh.
    function show() {
      clearTimeout(removeTimer);
      done = false;
      started = Date.now();
      var fresh = tiles.cloneNode(true);
      tiles.parentNode.replaceChild(fresh, tiles);
      tiles = fresh;
      loader.classList.remove('boot-loader--hidden');
      html.classList.add('boot-loading');
      if (!loader.parentNode) document.body.appendChild(loader);
      shownForLeaving = true;
    }

    // Back/forward can restore this page from the browser's cache with the
    // loader still showing: take it away
    window.addEventListener('pageshow', function (event) {
      if (event.persisted && shownForLeaving) {
        shownForLeaving = false;
        hide();
      }
    });

    // A game that renders before its data is ready calls hold() before
    // rendering and hide() when it is ready. show() covers the page again,
    // for example when switching to another page of the game.
    window.bootLoader = {
      hold: function () { held = true; },
      hide: function () {
        // Wait a frame so the game has painted underneath
        requestAnimationFrame(function () { requestAnimationFrame(requestHide); });
      },
      show: show,
    };

    // This script sits right after #root, so it watches before the game's
    // scripts (deferred or modules) run and render into it
    var root = document.getElementById('root');
    if (root && window.MutationObserver) {
      var observer = new MutationObserver(function () {
        if (!root.firstElementChild) return;
        observer.disconnect();
        if (!held) window.bootLoader.hide();
      });
      observer.observe(root, {childList: true});
    } else {
      window.addEventListener('load', requestHide);
    }

    // Never leave the page covered if the game fails to load
    setTimeout(hide, 8000);
  })();
</script>
